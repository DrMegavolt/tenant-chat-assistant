[project]
name = "tenantchat-core"
version = "0.1.0"
description = "Framework-free domain model: entities, policies, and ports"
requires-python = ">=3.12,<3.13"

# INVARIANT: this list stays empty.
#
# ADR-0001 requires that authentication, authorization, validation, transactions,
# and idempotency live in deterministic domain services that no agent framework
# can reach into. Keeping the domain package dependency-free is how that rule is
# enforced mechanically instead of by review: FastAPI, SQLAlchemy, LangGraph, and
# every model SDK are structurally unable to appear in a domain type.
#
# `tests/test_architecture_invariants.py` fails the build if this grows.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenantchat"]
