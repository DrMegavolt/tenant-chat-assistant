# Local development and single-host application runtime.
#
#     make up             # Postgres + Elasticsearch for host development
#     make up-all         # also the embedding service
#     make compose-up     # complete containerized visitor demo
#     make compose-smoke  # health and gateway verification
#     make compose-seed   # governed demo knowledge
#
# Every credential is required from the environment with `:?`, so a missing value
# fails immediately with a named variable instead of starting a service on a
# well-known default password (SEC-005).

name: tenantchat

x-api-build: &api-build
  context: .
  dockerfile: services/api/Dockerfile

x-api-environment: &api-environment
  APP_ENV: local
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  LLM_BASE_URL: ${COMPOSE_LLM_BASE_URL:-http://host.docker.internal:1234/v1}
  LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL in .env}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
  ADMIN_CSRF_SECRET: ${ADMIN_CSRF_SECRET:?set ADMIN_CSRF_SECRET in .env}
  ADMIN_GATEWAY_TOKEN: ${ADMIN_GATEWAY_TOKEN:?set ADMIN_GATEWAY_TOKEN in .env}
  CHAT_API_VISITOR_CREDENTIAL_SIGNING_KEY: ${CHAT_API_VISITOR_CREDENTIAL_SIGNING_KEY:?set CHAT_API_VISITOR_CREDENTIAL_SIGNING_KEY in .env}
  CHAT_API_ALLOWED_ORIGINS: ${CHAT_API_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  CHAT_API_DOCS_ENABLED: ${CHAT_API_DOCS_ENABLED:-true}
  CHAT_API_LOG_JSON: ${CHAT_API_LOG_JSON:-true}
  CHAT_API_LOG_LEVEL: ${CHAT_API_LOG_LEVEL:-INFO}
  CHAT_API_LOG_PSEUDONYM_KEY: ${CHAT_API_LOG_PSEUDONYM_KEY:-}
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ES_USERNAME: ${ES_USERNAME:?set ES_USERNAME in .env}
  ES_PASSWORD: ${ES_PASSWORD:?set ES_PASSWORD in .env}
  KNOWLEDGE_INDEX: ${KNOWLEDGE_INDEX:-tenant-knowledge-chunks}
  EMBEDDING_URL: http://embedding:8001
  CHAT_TO_EMBEDDING_TOKEN: ${CHAT_TO_EMBEDDING_TOKEN:?set CHAT_TO_EMBEDDING_TOKEN in .env}
  INGESTION_STORAGE_ROOT: /data/knowledge
  CHAT_RAG_REQUIRED: "true"

services:
  postgres:
    image: postgres:16.11-alpine3.23@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Deterministic collation keeps index ordering identical across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Naming the database and user avoids a false ready signal during the
      # brief window when initdb has a server up but the app database absent.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3@sha256:01c1732062b4a846c5ca687b0094b89bad0bfed00c6d71626db32fb8f3131a78
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ES_PASSWORD:?set ES_PASSWORD in .env}
      # Authentication on, transport encryption off. The retrieval client then
      # exercises the same credential path locally that it uses in Kubernetes;
      # disabling security outright would leave that code untested until deploy.
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -u "elastic:$${ELASTIC_PASSWORD}"
          "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    ulimits:
      memlock: { soft: -1, hard: -1 }

  # Optional: `make up-all`. Excluded from the default set because the first run
  # downloads model weights and the container is memory-hungry on a laptop.
  embedding:
    profiles: ["embedding", "app"]
    build:
      context: .
      dockerfile: services/embedding/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: local
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:?set EMBEDDING_MODEL_REVISION in .env}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      INGESTION_TO_EMBEDDING_TOKEN: ${INGESTION_TO_EMBEDDING_TOKEN:?set INGESTION_TO_EMBEDDING_TOKEN in .env}
      CHAT_TO_EMBEDDING_TOKEN: ${CHAT_TO_EMBEDDING_TOKEN:-}
    ports:
      - "${EMBEDDING_PORT:-8001}:8001"
    volumes:
      # Cache weights across container rebuilds. The path must track HF_HOME in
      # services/embedding/Dockerfile: the image runs as uid 10001, which cannot
      # write /root, so a mount there silently re-downloads the model every run.
      - huggingface-cache:/home/tenantchat/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as r; r.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # One-shot release phase. API and worker use service_completed_successfully
  # so a schema failure cannot leave an apparently running partial stack.
  migrate:
    profiles: ["app"]
    build: *api-build
    restart: "no"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        alembic upgrade head
        python /app/scripts/setup_checkpoints.py
    environment:
      DATABASE_MIGRATION_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: *api-build
    restart: unless-stopped
    environment: *api-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8004}:8004"
    volumes:
      - knowledge-storage:/data/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      embedding:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as r;
          r.urlopen('http://127.0.0.1:8004/readyz', timeout=10)"
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 20s

  worker:
    profiles: ["app"]
    build: *api-build
    restart: unless-stopped
    command: ["python", "-m", "tenantchat.api.job_worker"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      PRIVACY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_USERNAME: ${ES_USERNAME:?set ES_USERNAME in .env}
      ES_PASSWORD: ${ES_PASSWORD:?set ES_PASSWORD in .env}
      KNOWLEDGE_INDEX: ${KNOWLEDGE_INDEX:-tenant-knowledge-chunks}
      EMBEDDING_URL: http://embedding:8001
      INGESTION_TO_EMBEDDING_TOKEN: ${INGESTION_TO_EMBEDDING_TOKEN:?set INGESTION_TO_EMBEDDING_TOKEN in .env}
      INGESTION_STORAGE_ROOT: /data/knowledge
      CHAT_API_LOG_JSON: ${CHAT_API_LOG_JSON:-true}
      CHAT_API_LOG_LEVEL: ${CHAT_API_LOG_LEVEL:-INFO}
      CHAT_API_LOG_PSEUDONYM_KEY: ${CHAT_API_LOG_PSEUDONYM_KEY:-}
    volumes:
      - knowledge-storage:/data/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      embedding:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "tenantchat.api.job_worker", "--check"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Optional: `make web`. The same image Kubernetes serves the site from, so a
  # broken proxy rule, cache header, or CSP shows up locally rather than after a
  # deploy. Hot-reload development is `make dev` instead; this is the deployed
  # shape, and its assets are baked into the image at build time.
  web:
    profiles: ["web", "app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      CHAT_BACKEND_ORIGIN: http://api:8004
      CHAT_ADMIN_ORIGIN: http://api:8004
      # Local Compose has no oauth2-proxy sidecar, so browser admin routes are
      # intentionally unavailable. nginx still requires a valid internal
      # origin while rendering the shared Kubernetes/Compose configuration.
      AUTH_PROXY_ORIGIN: http://api:8004
      ADMIN_GATEWAY_TOKEN: ${ADMIN_GATEWAY_TOKEN:?set ADMIN_GATEWAY_TOKEN in .env}
      WIDGET_ALLOWED_ORIGINS: ${WIDGET_ALLOWED_ORIGINS:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: the listener is IPv4 and localhost resolves to
      # ::1 first inside the container.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Explicit one-shot task rather than part of compose-up: a developer may
  # want an empty application, and first-run embedding downloads can be slow.
  seed-knowledge:
    profiles: ["seed"]
    build: *api-build
    restart: "no"
    command: ["python", "/app/scripts/seed_knowledge.py"]
    environment:
      API_BASE_URL: http://api:8004
      ADMIN_GATEWAY_TOKEN: ${ADMIN_GATEWAY_TOKEN:?set ADMIN_GATEWAY_TOKEN in .env}
      ADMIN_CSRF_SECRET: ${ADMIN_CSRF_SECRET:?set ADMIN_CSRF_SECRET in .env}
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy

# Kibana is deliberately absent. Kibana 8 refuses to start when configured with
# the `elastic` superuser, so a local instance needs the `kibana_system` account
# provisioned first (see k8s/kibana-setup-job.yaml). Until RAG-004 makes index
# inspection a routine task, curl against Elasticsearch is enough:
#
#     curl -u "elastic:$ES_PASSWORD" localhost:9200/tenant-knowledge-chunks/_search

volumes:
  postgres-data:
  elasticsearch-data:
  huggingface-cache:
  knowledge-storage:
