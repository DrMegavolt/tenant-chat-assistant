name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # This is intentionally the same single command contributors run locally.
      # Browser and Python tests use fakes and require no service containers.
      - name: Run complete quality gate
        run: make check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 30
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/
          retention-days: 30
          if-no-files-found: error

  security:
    name: Dependency and container scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build prototype image for scanning
        run: docker build --tag tenant-chat-ci:${{ github.sha }} .

      # Pinned to the immutable, known-safe v0.35.0 release. Older mutable tags
      # were affected by the March 2026 Trivy action supply-chain incident.
      - name: Create dependency vulnerability report
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-dependencies.json
          exit-code: 0

      - name: Block high-severity dependency findings
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true

      - name: Create container vulnerability report
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: tenant-chat-ci:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-container.json
          exit-code: 0
          skip-setup-trivy: true

      - name: Block high-severity container findings
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: tenant-chat-ci:${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-reports
          path: trivy-*.json
          retention-days: 30
          if-no-files-found: warn

  architecture:
    name: Architecture model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: architecture/likec4/package-lock.json

      - name: Install
        run: npm --prefix architecture/likec4 ci

      - name: Check formatting
        run: npm --prefix architecture/likec4 run format:check

      - name: Validate model
        run: npm --prefix architecture/likec4 run validate

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a credential removed in the tip commit is still live if
          # it was ever pushed. SEC-005 requires rotating anything committed.
          fetch-depth: 0

      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
