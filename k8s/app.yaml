  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: job-worker
  namespace: llm-chat
  labels:
    release: kube-prom-stack
spec:
  selector:
