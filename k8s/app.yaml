apiVersion: v1
kind: Namespace
metadata:
  name: llm-chat
  labels:
    tenantchat.openai.com/network-boundary: application
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: llm-chat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedding-model-cache
  namespace: llm-chat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: llm-chat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-upload-storage
  namespace: llm-chat
spec:
  # The API writes uploads and the worker reads them back, so both pods on the
  # single demo node mount this same claim (RAG-002).
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: llm-chat
  labels:
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: llm-chat
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3@sha256:01c1732062b4a846c5ca687b0094b89bad0bfed00c6d71626db32fb8f3131a78
          ports:
            - containerPort: 9200
              name: http
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: node.store.allow_mmap
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elasticsearch-data
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: llm-chat
  labels:
    app: kibana
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: kibana
  ports:
    - name: http
      port: 5601
      targetPort: 5601
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: llm-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.3@sha256:43dffccc4085ebca96ed8a8da30116fa3a246c9e204b028949d2a8e733544987
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kibana-credentials
                  key: username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kibana-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: llm-chat
  labels:
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: llm-chat
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.11-alpine3.23@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
          readinessProbe:
            exec:
              # Resolved from the same secret-backed env the server itself
              # uses, so the probe can never disagree with the deployed
              # role/database the way a hardcoded `-U chat_app` would if the
              # credential were ever rotated.
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: llm-chat
  labels:
    app: embedding-service
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: embedding-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: llm-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: llm-chat/python-instrumentation
      labels:
        app: embedding-service
    spec:
      securityContext:
        # The model PVC is writable by the fixed non-root image user.
        fsGroup: 10001
      containers:
        - name: embedding-service
          # Release automation replaces only the digest token after recording
          # build metadata. k8s/deploy.sh refuses unresolved contracts.
          image: registry.example.invalid/tenantchat/embedding@sha256:REPLACE_WITH_EMBEDDING_DIGEST
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPATH
              value: /app/.venv/lib/python3.12/site-packages
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: APP_ENV
              value: production
            - name: EMBEDDING_MODEL
              value: Qwen/Qwen3-Embedding-0.6B
            - name: EMBEDDING_MODEL_REVISION
              value: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
            - name: EMBEDDING_DEVICE
              value: cpu
            - name: INGESTION_TO_EMBEDDING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ingestion-to-embedding-credentials
                  key: token
            - name: CHAT_TO_EMBEDDING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chat-to-embedding-credentials
                  key: token
          resources:
            requests:
              memory: 3Gi
              cpu: "1"
            limits:
              memory: 8Gi
              cpu: "4"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            # /health never touches the model, so liveness cannot fire during
            # the (minutes-long) load /ready gates; it only fails when the
            # process itself is wedged.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /home/tenantchat/.cache/huggingface
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embedding-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: llm-chat
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: tenant-chat
    tenantchat.openai.com/exposure: public-entrypoint
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# oauth2-proxy: OIDC authentication sidecar for the single-origin gateway.
# The gateway auth-gates admin routes (/admin/ and /api/admin/) through this
# service. It validates the OIDC session cookie and returns X-Auth-Request
# identity headers; nginx maps provider groups to roles before forwarding.
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: llm-chat
  labels:
    app: oauth2-proxy
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tenant-chat
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: llm-chat
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: tenant-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: llm-chat
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: tenant-chat
    spec:
      containers:
        - name: web
          image: registry.example.invalid/tenantchat/web@sha256:REPLACE_WITH_WEB_DIGEST
          ports:
            - containerPort: 8080
              name: http
          env:
            # The API serves visitor and admin routes on the single chat-admin
            # Service; the separate 8000-alias Service is gone.
            - name: CHAT_BACKEND_ORIGIN
              value: http://chat-admin:8004
            - name: CHAT_ADMIN_ORIGIN
              value: http://chat-admin:8004
            # oauth2-proxy auth-check and browser OAuth endpoints. Browser
            # redirects remain relative to the gateway's public origin.
            - name: AUTH_PROXY_ORIGIN
              value: http://oauth2-proxy:4180
            - name: ADMIN_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: admin-gateway-credentials
                  key: token
            # Cross-origin widget CORS allowlist (comma-separated origins).
            # Empty means same-origin only; never wildcard.
            - name: WIDGET_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: widget-cors-origins
                  key: origins
          resources:
            requests:
              memory: 32Mi
              cpu: 20m
            limits:
              memory: 128Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            # The rendered site configuration and nginx's temporary paths are
            # the only things the container writes.
            - name: rendered-config
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: rendered-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# oauth2-proxy validates OIDC session cookies and injects identity headers.
# Configured via environment variables referencing OIDC provider secrets.
# See docs/adr/0007-single-origin-gateway.md for the full auth flow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: llm-chat
  labels:
    app: oauth2-proxy
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tenant-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: llm-chat
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: tenant-chat
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2@sha256:REPLACE_WITH_OAUTH2_PROXY_DIGEST
          ports:
            - containerPort: 4180
              name: http
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: "0.0.0.0:4180"
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "true"
            - name: OAUTH2_PROXY_COOKIE_HTTPONLY
              value: "true"
            - name: OAUTH2_PROXY_COOKIE_SAMESITE
              # Lax permits the top-level redirect back from the external IdP
              # while still withholding the session on cross-site subrequests.
              value: "lax"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_SCOPE
              value: "openid profile email groups"
            - name: OAUTH2_PROXY_UPSTREAMS
              value: "static://202"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            # PKCE binds the authorization code to this client instance. The
            # realm requires S256; discovery is off, so the method cannot be
            # negotiated and has to be stated here.
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            # OIDC provider configuration — provisioned from secrets out of band.
            - name: OAUTH2_PROXY_PROVIDER
              value: "oidc"
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-credentials
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-credentials
                  key: clientSecret
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: oidc-credentials
                  key: issuerUrl
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-credentials
                  key: cookieSecret
            # Discovery is skipped so the browser-facing and backchannel
            # endpoints can differ: the login redirect has to be an address the
            # user's browser can reach, while the code redemption, JWKS, and
            # userinfo calls stay inside the cluster and never depend on
            # split-horizon DNS or on the cluster trusting the gateway's
            # certificate. The issuer above is the browser-facing one and is
            # what the `iss` claim is compared against, so the provider must
            # mint tokens with a fixed hostname (see ADR-0008).
            - name: OAUTH2_PROXY_SKIP_OIDC_DISCOVERY
              value: "true"
            - name: OAUTH2_PROXY_LOGIN_URL
              valueFrom:
                configMapKeyRef:
                  name: oidc-endpoints
                  key: loginUrl
            - name: OAUTH2_PROXY_REDEEM_URL
              valueFrom:
                configMapKeyRef:
                  name: oidc-endpoints
                  key: redeemUrl
            - name: OAUTH2_PROXY_OIDC_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: oidc-endpoints
                  key: jwksUrl
            - name: OAUTH2_PROXY_PROFILE_URL
              valueFrom:
                configMapKeyRef:
                  name: oidc-endpoints
                  key: profileUrl
            # Stated rather than derived from the request: the value has to be
            # byte-identical to the redirect URI registered on the client.
            - name: OAUTH2_PROXY_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: oidc-endpoints
                  key: redirectUrl
          resources:
            requests:
              memory: 32Mi
              cpu: 20m
            limits:
              memory: 128Mi
              cpu: 250m
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: chat-admin
  namespace: llm-chat
  labels:
    app: chat-backend
    app.kubernetes.io/name: chat-admin
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tenant-chat
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: chat-backend
  ports:
    - name: http
      port: 8004
      targetPort: 8004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  namespace: llm-chat
  labels:
    app: chat-backend
    app.kubernetes.io/name: chat-backend
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tenant-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-backend
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: llm-chat/python-instrumentation
      labels:
        app: chat-backend
        app.kubernetes.io/name: chat-backend
        app.kubernetes.io/instance: llm-chat
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: tenant-chat
    spec:
      containers:
        - name: chat-backend
          image: registry.example.invalid/tenantchat/api@sha256:REPLACE_WITH_API_DIGEST
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # The operator rewrites PYTHONPATH to
            # <auto-instrumentation bootstrap>:<this value>:<auto-instrumentation packages>,
            # so naming the image's site-packages here is the only way to keep the
            # injected bundle's older pinned dependencies from shadowing the locked
            # ones. Without it the bundle's typing_extensions wins and langchain
            # fails to import at startup.
            - name: PYTHONPATH
              value: /app/.venv/lib/python3.12/site-packages
            # The Instrumentation resource asks for no log export, but the
            # operator's Python injection overrides its spec.env with otlp;
            # only container env survives. The gateway runs traces and metrics
            # pipelines alone, so exported log records would 404 — and under
            # ADR-0010 log records belong to the redacted plane, not to the
            # trace plane this exporter feeds.
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: APP_ENV
              value: production
            - name: OTEL_SERVICE_NAME
              value: chat-backend
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: databaseUrl
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: baseUrl
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: model
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-provider-credentials
                  key: apiKey
            - name: LLM_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: timeoutSeconds
            - name: ADMIN_CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-csrf-secret
                  key: secret
            - name: ADMIN_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: admin-gateway-credentials
                  key: token
            # SEC-002: signs the visitor credentials the widget exchanges for
            # session identity. Required at startup; without it the visitor
            # routes fail closed, like the admin credentials above.
            - name: CHAT_API_VISITOR_CREDENTIAL_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: visitor-credential-signing-key
                  key: key
            # The API applies its own origin allowlist to the visitor surface;
            # bearer identity stays in the explicit visitor credential header.
            - name: CHAT_API_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: widget-cors-origins
                  key: origins
            - name: CHAT_API_DOCS_ENABLED
              value: "false"
            # RAG-002: the tenant-isolated upload root, shared with the worker
            # through the knowledge-storage claim.
            - name: INGESTION_STORAGE_ROOT
              value: /data/knowledge
            # The upload route's object store and the answer path's retrieval
            # are composed only when a search or embedding URL is present. With
            # the storage root alone, this pod accepted no uploads
            # (`storage_unavailable`) and answered every turn with no retrieval
            # and no citations, while the worker behind it was fully wired.
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
            - name: KNOWLEDGE_INDEX
              value: tenant-knowledge-chunks
            - name: EMBEDDING_URL
              value: http://embedding-service:8001
            - name: CHAT_TO_EMBEDDING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chat-to-embedding-credentials
                  key: token
            - name: CHAT_RAG_REQUIRED
              value: "true"
          volumeMounts:
            - name: knowledge-storage
              mountPath: /data/knowledge
          resources:
            # R-23. The API holds the LangGraph runtime, the streaming LLM
            # client, and the retrieval fan-out; idle RSS sits near 150Mi and
            # the model runs off-box, so the limit is headroom for bursts of
            # concurrent turns, not model weights (that is embedding-service).
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            # /readyz now genuinely probes the embedder (R-25); the resilience
            # client's retries need more than k8s' 1s default probe timeout.
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: knowledge-storage
          persistentVolumeClaim:
            claimName: knowledge-upload-storage
---
# REL-003 durable outbox worker. It shares the immutable API image but serves
# no application route: work arrives from PostgreSQL. The one HTTP listener is
# the metrics plane on 8005 (Service `job-worker` + ServiceMonitor); readiness
# is the exec probe below, not an HTTP endpoint. SIGTERM stops new leases and
# lets the bounded in-flight batch finish before the grace period.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-worker
  namespace: llm-chat
  labels:
    app: job-worker
    app.kubernetes.io/name: job-worker
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: tenant-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-worker
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: llm-chat/python-instrumentation
      labels:
        app: job-worker
        app.kubernetes.io/name: job-worker
        app.kubernetes.io/instance: llm-chat
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: tenant-chat
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: job-worker
          image: registry.example.invalid/tenantchat/api@sha256:REPLACE_WITH_API_DIGEST
          command: ["python", "-m", "tenantchat.api.job_worker"]
          ports:
            - containerPort: 8005
              name: http
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPATH
              value: /app/.venv/lib/python3.12/site-packages
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: APP_ENV
              value: production
            - name: OTEL_SERVICE_NAME
              value: job-worker
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: databaseUrl
            - name: PRIVACY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: privacy-database-credentials
                  key: databaseUrl
            # RAG-002 ingestion handler dependencies. The handler is composed
            # only when all three are configured, so a partial configuration
            # dead-letters ingestion jobs instead of indexing into a guess.
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
            - name: KNOWLEDGE_INDEX
              value: tenant-knowledge-chunks
            - name: EMBEDDING_URL
              value: http://embedding-service:8001
            - name: INGESTION_TO_EMBEDDING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ingestion-to-embedding-credentials
                  key: token
            - name: INGESTION_STORAGE_ROOT
              value: /data/knowledge
            - name: JOB_LEASE_SECONDS
              value: "60"
            - name: JOB_BATCH_SIZE
              value: "10"
            - name: JOB_BACKOFF_SECONDS
              value: "5"
            - name: JOB_BACKOFF_CAP_SECONDS
              value: "3600"
          volumeMounts:
            - name: knowledge-storage
              mountPath: /data/knowledge
          resources:
            requests:
              memory: 64Mi
              cpu: 20m
            limits:
              memory: 256Mi
              cpu: 500m
          readinessProbe:
            exec:
              command: ["python", "-m", "tenantchat.api.job_worker", "--check"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: knowledge-storage
          persistentVolumeClaim:
            claimName: knowledge-upload-storage
---
apiVersion: v1
kind: Service
metadata:
  name: job-worker
  namespace: llm-chat
  labels:
    app: job-worker
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: job-worker
  ports:
    - name: http
      port: 8005
      targetPort: 8005
---
apiVersion: monitoring.coreos.com/v1
