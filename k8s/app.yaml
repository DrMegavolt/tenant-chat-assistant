      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ingestion-service
  namespace: llm-chat
  labels:
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app: ingestion-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: financing-agent
  namespace: llm-chat
  labels:
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app: financing-agent
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
