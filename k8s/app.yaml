            - containerPort: 8003
              name: http
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: APP_ENV
              value: production
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
