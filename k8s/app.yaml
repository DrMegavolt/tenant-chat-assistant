---
apiVersion: v1
kind: Service
metadata:
  name: chat-backend
  namespace: llm-chat
  labels:
    app: chat-backend
    app.kubernetes.io/name: chat-backend
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tenant-chat
spec:
  selector:
    app: chat-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  namespace: llm-chat
  labels:
    app: chat-backend
    app.kubernetes.io/name: chat-backend
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tenant-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-backend
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: llm-chat/python-instrumentation
      labels:
        app: chat-backend
        app.kubernetes.io/name: chat-backend
        app.kubernetes.io/instance: llm-chat
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: tenant-chat
    spec:
      containers:
        - name: chat-backend
          image: python:3.11-slim
          workingDir: /app
          command:
            - sh
            - -c
            - pip install --no-cache-dir -r requirements.txt && python server.py
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: APP_ENV
              value: production
            - name: OTEL_SERVICE_NAME
              value: chat-backend
            - name: CHAT_HOST
              value: 0.0.0.0
            - name: CHAT_PORT
              value: "8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: databaseUrl
            - name: DATABASE_INIT_RETRIES
              value: "60"
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: baseUrl
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: model
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-provider-credentials
                  key: apiKey
            - name: LLM_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: timeoutSeconds
            - name: FINANCING_AGENT_URL
              value: http://financing-agent:8003
          readinessProbe:
            httpGet:
              path: /api/tenants
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: chat-backend-code
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chat-backend
  namespace: llm-chat
  labels:
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app: chat-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
