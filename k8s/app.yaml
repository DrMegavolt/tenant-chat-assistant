apiVersion: v1
kind: Namespace
metadata:
  name: llm-chat
  labels:
    tenantchat.openai.com/network-boundary: application
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: llm-chat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedding-model-cache
  namespace: llm-chat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: llm-chat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: llm-chat
  labels:
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: llm-chat
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3@sha256:01c1732062b4a846c5ca687b0094b89bad0bfed00c6d71626db32fb8f3131a78
          ports:
            - containerPort: 9200
              name: http
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: node.store.allow_mmap
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elasticsearch-data
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: llm-chat
  labels:
    app: kibana
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: kibana
  ports:
    - name: http
      port: 5601
      targetPort: 5601
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: llm-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.3@sha256:43dffccc4085ebca96ed8a8da30116fa3a246c9e204b028949d2a8e733544987
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kibana-credentials
                  key: username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kibana-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: llm-chat
  labels:
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: llm-chat
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.11-alpine3.23@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - chat_app
                - -d
                - chat_app
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: llm-chat
  labels:
    app: embedding-service
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: embedding-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: llm-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: llm-chat/python-instrumentation
      labels:
        app: embedding-service
    spec:
      securityContext:
        # The model PVC is writable by the fixed non-root image user.
        fsGroup: 10001
      containers:
        - name: embedding-service
          # Release automation replaces only the digest token after recording
          # build metadata. k8s/deploy.sh refuses unresolved contracts.
          image: registry.example.invalid/tenantchat/embedding@sha256:REPLACE_WITH_EMBEDDING_DIGEST
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: APP_ENV
              value: production
            - name: EMBEDDING_MODEL
              value: Qwen/Qwen3-Embedding-0.6B
            - name: EMBEDDING_MODEL_REVISION
              value: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
            - name: EMBEDDING_DEVICE
              value: cpu
            - name: INGESTION_TO_EMBEDDING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ingestion-to-embedding-credentials
                  key: token
            - name: FINANCING_TO_EMBEDDING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: financing-to-embedding-credentials
                  key: token
          resources:
            requests:
              memory: 3Gi
              cpu: "1"
            limits:
              memory: 8Gi
              cpu: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: model-cache
              mountPath: /home/tenantchat/.cache/huggingface
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embedding-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: llm-chat
  labels:
    app: ingestion-service
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: ingestion-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: llm-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: llm-chat/python-instrumentation
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion-service
          image: registry.example.invalid/tenantchat/ingestion@sha256:REPLACE_WITH_INGESTION_DIGEST
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: APP_ENV
              value: production
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
            - name: EMBEDDING_URL
              value: http://embedding-service:8001
            - name: KNOWLEDGE_INDEX
              value: tenant-knowledge-chunks
            - name: DOCS_PATH
              value: /data/docs
            - name: SEED_TO_INGESTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: seed-to-ingestion-credentials
                  key: token
            - name: INGESTION_TO_EMBEDDING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ingestion-to-embedding-credentials
                  key: token
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: docs
              mountPath: /data/docs
      volumes:
        - name: docs
          configMap:
            name: financing-docs
            items:
              - key: apex-financing-options.md
                path: apex/financing/financing-options.md
              - key: clearview-financing-options.md
                path: clearview/financing/financing-options.md
---
apiVersion: v1
kind: Service
metadata:
  name: financing-agent
  namespace: llm-chat
  labels:
    app: financing-agent
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    app: financing-agent
  ports:
    - name: http
      port: 8003
      targetPort: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: financing-agent
  namespace: llm-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: financing-agent
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: llm-chat/python-instrumentation
      labels:
        app: financing-agent
    spec:
      containers:
        - name: financing-agent
          image: registry.example.invalid/tenantchat/financing@sha256:REPLACE_WITH_FINANCING_DIGEST
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: APP_ENV
              value: production
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
            - name: EMBEDDING_URL
              value: http://embedding-service:8001
            - name: KNOWLEDGE_INDEX
              value: tenant-knowledge-chunks
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: baseUrl
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: model
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-provider-credentials
                  key: apiKey
            - name: LLM_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: timeoutSeconds
            - name: CHAT_TO_FINANCING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chat-to-financing-credentials
                  key: token
            - name: FINANCING_TO_EMBEDDING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: financing-to-embedding-credentials
                  key: token
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chat-backend
  namespace: llm-chat
  labels:
    app: chat-backend
    app.kubernetes.io/name: chat-backend
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tenant-chat
    tenantchat.openai.com/exposure: public-entrypoint
spec:
  selector:
    app: chat-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: chat-admin
  namespace: llm-chat
  labels:
    app: chat-backend
    app.kubernetes.io/name: chat-admin
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tenant-chat
    tenantchat.openai.com/metrics: enabled
spec:
  selector:
    app: chat-backend
  ports:
    - name: admin-http
      port: 8004
      targetPort: 8004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  namespace: llm-chat
  labels:
    app: chat-backend
    app.kubernetes.io/name: chat-backend
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tenant-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-backend
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: llm-chat/python-instrumentation
      labels:
        app: chat-backend
        app.kubernetes.io/name: chat-backend
        app.kubernetes.io/instance: llm-chat
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: tenant-chat
    spec:
      containers:
        - name: chat-backend
          image: registry.example.invalid/tenantchat/prototype@sha256:REPLACE_WITH_PROTOTYPE_DIGEST
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8004
              name: admin-http
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: APP_ENV
              value: production
            - name: OTEL_SERVICE_NAME
              value: chat-backend
            - name: CHAT_HOST
              value: 0.0.0.0
            - name: CHAT_PORT
              value: "8000"
            - name: CHAT_ADMIN_PORT
              value: "8004"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: databaseUrl
            - name: DATABASE_INIT_RETRIES
              value: "60"
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: baseUrl
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: model
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-provider-credentials
                  key: apiKey
            - name: LLM_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: llm-runtime
                  key: timeoutSeconds
            - name: FINANCING_AGENT_URL
              value: http://financing-agent:8003
            - name: CHAT_TO_FINANCING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chat-to-financing-credentials
                  key: token
          readinessProbe:
            httpGet:
              path: /api/tenants
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chat-backend
  namespace: llm-chat
  labels:
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      tenantchat.openai.com/metrics: enabled
  endpoints:
    - port: admin-http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
