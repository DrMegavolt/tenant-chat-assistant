# Public service entrypoints for the local MicroK8s MetalLB pool.
#
# The Helm/application Services remain ClusterIP so their internal contracts
# and selectors stay stable across upgrades. These Services expose only the
# browser-facing ports; management, data, worker, and backchannel Services stay
# private.
apiVersion: v1
kind: Service
metadata:
  name: web-lb
  namespace: llm-chat
  labels:
    app: web
    app.kubernetes.io/instance: llm-chat
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: tenant-chat
    tenantchat.openai.com/exposure: public-loadbalancer
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.180
  externalTrafficPolicy: Cluster
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-lb
  namespace: identity
  labels:
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: tenant-chat
    tenantchat.openai.com/exposure: public-loadbalancer
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.181
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
