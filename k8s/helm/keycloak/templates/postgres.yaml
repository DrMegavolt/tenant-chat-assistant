{{- if .Values.database.embedded }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tenantchat.keycloak.postgresName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenantchat.keycloak.commonLabels" . | nindent 4 }}
    {{- include "tenantchat.keycloak.postgresSelectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
    tenantchat.openai.com/exposure: internal
spec:
  selector:
    {{- include "tenantchat.keycloak.postgresSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tenantchat.keycloak.postgresName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenantchat.keycloak.commonLabels" . | nindent 4 }}
    {{- include "tenantchat.keycloak.postgresSelectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "tenantchat.keycloak.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "tenantchat.keycloak.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenantchat.keycloak.commonLabels" . | nindent 8 }}
        {{- include "tenantchat.keycloak.postgresSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      securityContext:
        # The pinned Alpine image declares the postgres account as UID/GID 70
        # (the Debian variant uses 999). Running as the image's real account
        # avoids an entrypoint chown, so the container can keep every
        # capability dropped while kubelet grants the PVC group ownership.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # hostPath-backed PVCs arrive owned by root. Prepare only this mount
        # with the minimum capabilities, then run the database itself as UID
        # 70 with every capability dropped.
        - name: postgres-volume-permissions
          image: {{ include "tenantchat.keycloak.postgresImage" . }}
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          command:
            - sh
            - -ec
            - >-
              mkdir -p /var/lib/postgresql/data/pgdata;
              chown -R 70:70 /var/lib/postgresql/data;
              chmod 700 /var/lib/postgresql/data/pgdata
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: {{ include "tenantchat.keycloak.postgresImage" . }}
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret.name }}
                  key: {{ .Values.database.credentialsSecret.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret.name }}
                  key: {{ .Values.database.credentialsSecret.passwordKey }}
            # Deterministic collation keeps index ordering identical to the
            # application's Postgres and to a laptop restore of the same volume.
            - name: POSTGRES_INITDB_ARGS
              value: "--locale=C --encoding=UTF8"
            # initdb refuses to run in a directory it does not own; the
            # PersistentVolume root often carries lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.database.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage.size }}
{{- end }}
