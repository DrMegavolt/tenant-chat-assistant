# Arize Phoenix — OBS-004 candidate trace viewer.
#
# ADR-0010 makes this a disposable projection of the operational plane: the
# collector's redaction allowlist runs ahead of the exporter that feeds it, so
# Phoenix receives identifiers, scores, counts, and durations, never prompt,
# evidence, or contact text. Deleting this release loses no provenance — the
# turn record in Postgres is the system of record.
#
# Secrets are not in this file. `phoenix-secret` is created out of band (see
# k8s/README.md) so nothing rotates it on `helm upgrade` and no credential
# reaches the repository.

postgresql:
  enabled: true

# SQLite and the bundled Postgres are mutually exclusive; Postgres is the one
# the chart supports for sustained span ingest.
persistence:
  enabled: false

auth:
  enableAuth: true
  # The secret is operator-created, so `helm upgrade` cannot regenerate
  # PHOENIX_SECRET and invalidate every stored credential.
  createSecret: false
  name: phoenix-secret
  useSecureCookies: false

server:
  port: 6006
  grpcPort: 4317
  # This cluster is not an analytics subject, and the UI must render without
  # reaching Google Fonts on a LAN-only address.
  telemetryEnabled: false
  allowExternalResources: false

database:
  # A projection is not an archive. Tempo holds the operational plane and
  # Postgres holds provenance; span retention here only has to outlive a
  # debugging session.
  defaultRetentionPolicyDays: 30
  postgres:
    db: phoenix
    user: postgres

# Exposure follows the repository convention: chart Services stay ClusterIP and
# k8s/trace-viewers.yaml owns the MetalLB address.
service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
