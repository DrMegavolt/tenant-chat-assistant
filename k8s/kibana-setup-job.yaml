apiVersion: batch/v1
kind: Job
metadata:
  name: configure-kibana-system-user
  namespace: llm-chat
spec:
  backoffLimit: 8
  template:
    metadata:
      labels:
        app: configure-kibana-system-user
        app.kubernetes.io/name: configure-kibana-system-user
        app.kubernetes.io/component: search-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure-kibana
          image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          env:
            - name: ELASTIC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: username
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
            - name: KIBANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kibana-credentials
                  key: password
          command:
            - sh
            - -c
            - |
              set -eu
              umask 077
              netrc_path=/tmp/elasticsearch.netrc
              payload_path=/tmp/kibana-password.json
              trap 'rm -f "$netrc_path" "$payload_path"' EXIT
              valid_credential() {
                case "$1" in
                  ''|*[!a-zA-Z0-9_-]*) return 1 ;;
                esac
              }
              if ! valid_credential "$ELASTIC_USERNAME" ||
                 ! valid_credential "$ELASTIC_PASSWORD" ||
                 ! valid_credential "$KIBANA_PASSWORD"; then
                echo "credential format must use only letters, digits, underscore, or hyphen" >&2
                exit 1
              fi
              printf 'machine elasticsearch login %s password %s\n' \
                "$ELASTIC_USERNAME" "$ELASTIC_PASSWORD" >"$netrc_path"
              printf '{"password":"%s"}' "$KIBANA_PASSWORD" >"$payload_path"
              until curl -sf --netrc-file "$netrc_path" \
                http://elasticsearch:9200/_cluster/health >/dev/null; do
                sleep 5
              done
              curl -sf --netrc-file "$netrc_path" \
                -H 'Content-Type: application/json' \
                -X POST http://elasticsearch:9200/_security/user/kibana_system/_password \
                --data-binary "@$payload_path"
