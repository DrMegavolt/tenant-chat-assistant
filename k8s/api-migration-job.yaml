# Release template. DEP-001 replaces the placeholder with the immutable image
# digest produced by the release pipeline. Apply this Job before rolling out API
# pods; migrations never run from the API container's startup command.
apiVersion: batch/v1
kind: Job
metadata:
  name: tenantchat-api-migrate
  namespace: llm-chat
  labels:
    app.kubernetes.io/name: tenantchat-api-migrate
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: tenant-chat
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenantchat-api-migrate
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: tenant-chat
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # The exact same API image serves traffic and runs migrations; only
          # the command differs. Release automation replaces the digest token.
          image: registry.example.invalid/tenantchat/api@sha256:REPLACE_WITH_API_DIGEST
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              alembic upgrade head
              python /app/scripts/setup_checkpoints.py
          env:
            - name: DATABASE_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-migration-credentials
                  key: databaseUrl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
