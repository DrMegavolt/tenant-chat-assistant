---
# The API serves the visitor and admin surfaces on the single port 8004; the
# prototype's separate public listener (8000) and its call out to the financing
# agent are gone.  Postgres remains reachable for the persistence adapters.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rag-callers-to-embedding
  namespace: llm-chat
spec:
  podSelector:
    matchLabels:
      app: embedding-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ingestion-service
        - podSelector:
            matchLabels:
              app: financing-agent
        # The worker and the API hold matching egress rules, but a connection
        # needs both sides: without these the ingestion handler could not embed
        # a chunk and the answer path could not embed a query, while every
        # egress policy read as though they could.
        - podSelector:
            matchLabels:
              app: job-worker
        - podSelector:
            matchLabels:
              app: chat-backend
      ports:
        - { protocol: TCP, port: 8001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-seed-to-ingestion
  namespace: llm-chat
spec:
  podSelector:
    matchLabels:
      app: ingestion-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: seed-financing-docs
      ports:
        - { protocol: TCP, port: 8002 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
