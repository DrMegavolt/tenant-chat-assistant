---
# Workload egress is split by caller so adding a dependency to one service cannot
# silently grant the same reachability to every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-egress
  namespace: llm-chat
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: chat-backend
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 8004 }
    - to:
        - podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - { protocol: TCP, port: 4180 }
---
