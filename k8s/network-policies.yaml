# SEC-004 application boundary. Policies select by stable workload labels; the
# namespace is default-deny and every allowed flow is listed explicitly below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: llm-chat
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: llm-chat
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# The web gateway is the only pod the ingress controller may reach, and nothing
# outside the namespace reaches the backend at all. There is intentionally no
# LoadBalancer service for Kibana, financing, ingestion, embedding, or data stores.
# Port 8080 is the single public listener; the separate admin port (8081) is gone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-ingress-to-web
  namespace: llm-chat
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        # 8081 is absent on purpose: the console listener is not routable.
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-oauth2-proxy
  namespace: llm-chat
spec:
  podSelector:
    matchLabels:
      app: oauth2-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - { protocol: TCP, port: 4180 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-chat
  namespace: llm-chat
spec:
  podSelector:
    matchLabels:
      app: chat-backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 8004 }
---
