  namespace: llm-chat
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: chat-backend
        - podSelector:
            matchLabels:
              app: job-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tenantchat-api-migrate
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-callers-to-elasticsearch
  namespace: llm-chat
spec:
  podSelector:
    matchLabels:
      app: elasticsearch
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ingestion-service
        - podSelector:
            matchLabels:
              app: financing-agent
        - podSelector:
            matchLabels:
              app: kibana
        - podSelector:
            matchLabels:
              app: configure-kibana-system-user
        # Same missing half as the embedding policy: the worker indexes chunks
        # here and the API retrieves them.
        - podSelector:
            matchLabels:
              app: job-worker
        - podSelector:
            matchLabels:
              app: chat-backend
      ports:
        - { protocol: TCP, port: 9200 }
---
# Workload egress is split by caller so adding a dependency to one service cannot
# silently grant the same reachability to every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-egress
  namespace: llm-chat
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: chat-backend
      ports:
        - { protocol: TCP, port: 8004 }
    - to:
        - podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - { protocol: TCP, port: 4180 }
---
# The API serves the visitor and admin surfaces on the single port 8004; the
# prototype's separate public listener (8000) and its call out to the financing
# agent are gone.  Postgres remains reachable for the persistence adapters.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chat-egress
  namespace: llm-chat
spec:
  podSelector:
    matchLabels:
      app: chat-backend
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - { protocol: TCP, port: 5432 }
    # RAG-002: the answer path retrieves chunks and embeds the query, and the
    # upload route needs the same index reachable to report on it.
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch
      ports:
        - { protocol: TCP, port: 9200 }
    - to:
        - podSelector:
            matchLabels:
              app: embedding-service
      ports:
        - { protocol: TCP, port: 8001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-job-worker-egress
  namespace: llm-chat
spec:
  podSelector:
    matchLabels:
      app: job-worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - { protocol: TCP, port: 5432 }
    # RAG-002: the ingestion handler reads uploads from the shared PVC, writes
    # chunks to Elasticsearch, and calls the embedding service.
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch
      ports:
        - { protocol: TCP, port: 9200 }
    - to:
        - podSelector:
            matchLabels:
              app: embedding-service
      ports:
        - { protocol: TCP, port: 8001 }
---
