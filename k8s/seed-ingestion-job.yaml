apiVersion: batch/v1
kind: Job
metadata:
  name: seed-financing-docs
  namespace: llm-chat
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: seed-financing-docs
        app.kubernetes.io/name: seed-financing-docs
        app.kubernetes.io/component: ingestion-seed
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: curlimages/curl:8.11.1
          env:
            - name: SEED_TO_INGESTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: seed-to-ingestion-credentials
                  key: token
          command:
            - sh
            - -c
            - |
              set -eu
              umask 077
              header_path=/tmp/internal-auth-header
              trap 'rm -f "$header_path"' EXIT
              printf 'Authorization: Bearer %s\n' "$SEED_TO_INGESTION_TOKEN" >"$header_path"
              curl -fsS -X POST http://ingestion-service:8002/ingest \
                -H "@$header_path" \
                -H 'Content-Type: application/json' \
                -d '{"tenantId":"apex","domain":"financing"}'
              curl -fsS -X POST http://ingestion-service:8002/ingest \
                -H "@$header_path" \
                -H 'Content-Type: application/json' \
                -d '{"tenantId":"clearview","domain":"financing"}'
