apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observability
spec:
  mode: deployment
  managementState: managed
  image: otel/opentelemetry-collector-contrib:0.127.0@sha256:e94cfd92357aa21f4101dda3c0c01f90e6f24115ba91b263c4d09fed7911ae68
  replicas: 1
  env:
    # Phoenix runs with authentication on, so the projection cannot be written
    # to by anything else on the LAN. PHOENIX_ADMIN_SECRET doubles as a
    # pre-shared bearer token, which keeps the exporter declarative — no key
    # minted by hand through the UI and pasted into a manifest.
    - name: PHOENIX_ADMIN_SECRET
      valueFrom:
        secretKeyRef:
          name: phoenix-secret
          key: PHOENIX_ADMIN_SECRET
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: prom
      port: 8889
      targetPort: 8889
      protocol: TCP
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # L-O06b: auto-instrumentation emits ~100k spans/day of database-client
      # and readiness-probe noise for near-zero diagnostic value, drowning the
      # ~dozens of application spans a demo day produces. Dropped here, ahead
      # of redaction and every exporter, keyed on what only the noise spans
      # carry: database-client semantic-convention attributes, and HTTP server
      # spans for the health/probe/metrics routes. Application spans —
      # tenantchat turn traffic, LLM calls, tool executions, admin reads —
      # match neither condition and pass untouched.
      filter/noise:
        error_mode: ignore
        traces:
          span:
            - 'attributes["db.system"] != nil or attributes["db.system.name"] != nil'
            - 'IsMatch(name, "^(GET|POST|HEAD) /(healthz|readyz|ready|health|ping|metrics)( |$)") or attributes["http.route"] == "/healthz" or attributes["http.route"] == "/readyz" or attributes["http.route"] == "/ready" or attributes["http.route"] == "/health" or attributes["http.route"] == "/ping" or attributes["http.route"] == "/metrics"'
      # PRIV-002/ADR-0010: the collector is the only fan-out point, and this
      # allowlist runs ahead of every exporter in every pipeline. Only the
      # operational-plane attributes below survive; anything content-bearing —
      # prompt or completion text, message bodies, retrieved document text,
      # contact details — is dropped here, so adding a backend cannot widen
      # what leaves the cluster. Extending this list is the reviewable act of
      # admitting a new operational attribute; content attributes have no
      # home on it. Content export to a trusted in-cluster viewer is a
      # separate, gated decision (TRACE_CONTENT_EXPORT) made by an operator
      # adding a dedicated pipeline for it — never by widening this allowlist.
      #
      # The operational attributes added for exemplar drill-through (L-O07a)
      # — http.route, error.type, llm.model_name — are route/error/model
      # names only. The orchestration emitter (otel.py EMITTED_ATTRIBUTES)
      # sets no message-content attributes, and no tenantchat.* span
      # attribute exists to admit; if one is added it must be a component or
      # node name, never text.
      #
      # The operator (0.116.0) pins the collector's own telemetry to the
      # removed `address` schema, so the collector image is the last one that
      # accepts it (0.127.0), and `allowed_keys` is exact-match only — the
      # k8s.* and gen_ai.usage.* families are enumerated, not globbed.
      redaction:
        allowed_keys:
          - service.name
          - service.namespace
          - service.instance.id
          - deployment.environment
          - server.address
          - server.port
          - network.protocol.name
          - network.protocol.version
          - url.scheme
          - url.path
          - http.request.method
          - http.route
          - http.response.status_code
          - error.type
          - llm.model_name
          - session.id
          - tenant.id
          - thread.id
          - gen_ai.system
          - gen_ai.operation.name
          - gen_ai.error.type
          - gen_ai.request.model
          - gen_ai.request.temperature
          - gen_ai.request.max_tokens
          - gen_ai.request.top_p
          - gen_ai.request.seed
          - gen_ai.response.model
          - gen_ai.response.finish_reason
          - openinference.span.kind
          - gen_ai.usage.input_tokens
          - gen_ai.usage.output_tokens
          - gen_ai.usage.total_tokens
          - k8s.cluster.name
          - k8s.cluster.uid
          - k8s.namespace.name
          - k8s.node.name
          - k8s.node.uid
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.ip
          - k8s.container.name
          - k8s.container.restart_count
          - k8s.deployment.name
          - k8s.replicaset.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.workload.name
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_mib: 256

    exporters:
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
      # OBS-004 viewer projections. Both sit in the same traces pipeline as
      # Tempo, downstream of `redaction`, which is what makes adding them a
      # configuration change rather than a privacy decision. Both speak
      # OTLP/HTTP only — neither accepts gRPC — so they cannot reuse the Tempo
      # exporter's transport.
      otlphttp/phoenix:
        endpoint: http://phoenix-svc.observability.svc.cluster.local:6006
        headers:
          authorization: "Bearer ${env:PHOENIX_ADMIN_SECRET}"
      otlphttp/mlflow:
        endpoint: http://mlflow.observability.svc.cluster.local
        headers:
          # MLflow routes spans to an experiment by header; 0 is the Default
          # experiment every server creates on first start.
          x-mlflow-experiment-id: "0"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/noise, redaction, batch]
          exporters: [otlp/tempo, otlphttp/phoenix, otlphttp/mlflow]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, redaction, batch]
          exporters: [prometheus]
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: python-instrumentation
  namespace: llm-chat
spec:
  exporter:
    endpoint: http://otel-gateway-collector.observability:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1.0"
  resource:
    addK8sUIDAttributes: true
    resourceAttributes:
      service.namespace: llm-chat
      # R-24: resolved by the kubelet against each workload's own APP_ENV at
      # container start (the injected env lands after the workload env), so a
      # workload running APP_ENV=production no longer reports the hardcoded
      # `test`. A workload that omits APP_ENV would carry the literal
      # `$(APP_ENV)`; every instrumented workload defines it.
      deployment.environment: $(APP_ENV)
  env:
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_TRACES_EXPORTER
      value: otlp
    - name: OTEL_METRICS_EXPORTER
      value: none
    - name: OTEL_LOGS_EXPORTER
      value: none
    - name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS
      value: aws_lambda
  python:
    # Pinned rather than left to the operator default (0.50b0), whose FastAPI
    # instrumentation predates the _IncludedRouter tree that FastAPI >= 0.137
    # builds for include_router() routes and raises AttributeError on every
    # request to one. 0.64b0 also tracks opentelemetry-api 1.43, next to the
    # 1.44 this project locks, so the injected bundle and the application agree
    # on the SDK the emitted spans go through.
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python@sha256:35cffd38fc714f4b9326a94d2ccf118e9f769cb519902c280e01c8cd2aa04fca
    env:
      - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
        # Health, readiness, and metrics routes never leave the pod usefully;
        # excluding them here keeps the probe spans from being emitted at all
        # (the collector's filter/noise is the backstop for anything that
        # still slips through, e.g. non-FastAPI instrumentation).
        value: /health,/metrics,/healthz,/readyz,/ready,/ping
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-gateway
  namespace: observability
  labels:
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: observability.otel-gateway
      app.kubernetes.io/managed-by: opentelemetry-operator
  endpoints:
    - port: prom
      path: /metrics
      interval: 30s
