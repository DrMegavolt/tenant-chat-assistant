apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observability
spec:
  mode: deployment
  managementState: managed
  image: otel/opentelemetry-collector-contrib:0.116.1@sha256:d0ebf65280da2e1b1491d1b93648281afd353d4b9ea19160090303cec9a233bd
  replicas: 1
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: prom
      port: 8889
      targetPort: 8889
      protocol: TCP
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # PRIV-002/ADR-0010: the collector is the only fan-out point, and this
      # allowlist runs ahead of every exporter in every pipeline. Only the
      # operational-plane attributes below survive; anything content-bearing —
      # prompt or completion text, message bodies, retrieved document text,
      # contact details — is dropped here, so adding a backend cannot widen
      # what leaves the cluster. Extending this list is the reviewable act of
      # admitting a new operational attribute; content attributes have no
      # home on it. Content export to a trusted in-cluster viewer is a
      # separate, gated decision (TRACE_CONTENT_EXPORT) made by an operator
      # adding a dedicated pipeline for it — never by widening this allowlist.
      redaction:
        allow_attributes:
          - service.name
          - service.namespace
          - service.instance.id
          - deployment.environment
          - k8s.*
          - server.address
          - server.port
          - network.protocol.name
          - network.protocol.version
          - url.scheme
          - url.path
          - http.request.method
          - http.response.status_code
          - session.id
          - tenant.id
          - thread.id
          - gen_ai.system
          - gen_ai.operation.name
          - gen_ai.error.type
          - gen_ai.request.model
          - gen_ai.request.temperature
          - gen_ai.request.max_tokens
          - gen_ai.request.top_p
          - gen_ai.request.seed
          - gen_ai.response.model
          - gen_ai.response.finish_reason
          - gen_ai.usage.*
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_mib: 256

    exporters:
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, redaction, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, redaction, batch]
          exporters: [prometheus]
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: python-instrumentation
  namespace: llm-chat
spec:
  exporter:
    endpoint: http://otel-gateway-collector.observability:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1.0"
  resource:
    addK8sUIDAttributes: true
    resourceAttributes:
      service.namespace: llm-chat
      deployment.environment: test
  env:
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_TRACES_EXPORTER
      value: otlp
    - name: OTEL_METRICS_EXPORTER
      value: none
    - name: OTEL_LOGS_EXPORTER
      value: none
    - name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS
      value: aws_lambda
  python:
    env:
      - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
        value: /health,/metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-gateway
  namespace: observability
  labels:
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: observability.otel-gateway
      app.kubernetes.io/managed-by: opentelemetry-operator
  endpoints:
    - port: prom
      path: /metrics
      interval: 30s
