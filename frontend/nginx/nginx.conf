# Main configuration for the web image.
#
# Everything here has to work as uid 10001: the container has no root, so
# nothing may write under /var/cache/nginx or /var/run, which is where the
# stock configuration puts the pid file and every temporary path.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # `$uri` rather than `$request`: the visitor session id travels as a query
    # parameter on /api/chat/session, and a session credential in an access log
    # is a credential in every log sink downstream of it (SEC-002).
    log_format tenantchat '$remote_addr $request_method $uri $status '
                          '$body_bytes_sent $request_time';
    access_log /dev/stdout tenantchat;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Matches CHAT_API_MAX_REQUEST_BYTES so an oversized body is refused at the
    # edge instead of being streamed to the backend first.
    client_max_body_size 64k;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Asset filenames are not yet content-hashed, so a long max-age would pin a
    # stale widget in visitor caches with no way to invalidate it. Versioned
    # asset paths are DEP-003; until then every response revalidates.
    map $uri $asset_cache_control {
        default                        "no-store";
        ~^/admin/                      "no-store";
        ~*\.(js|css|svg|png|webp|woff2)$ "public, max-age=300, must-revalidate";
    }

    # nginx normally stops inheriting parent add_header directives when a
    # location adds even one header. CORS locations add Vary/Allow-Origin and
    # still need the server-wide CSP and hardening headers.
    add_header_inherit merge;

    include /etc/nginx/conf.d/*.conf;
}
