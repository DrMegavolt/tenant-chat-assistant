[project]
name = "tenant-chat-assistant"
version = "0.1.0"
description = "Multi-tenant RAG and agent platform for home-services dispatch"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "tenantchat-core",
    "tenantchat-api",
    "tenantchat-orchestration",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
    # Characterization tests import the side-service ingestion and retrieval
    # modules, then replace every outbound request with a deterministic fake.
    "prometheus-client==0.21.1",
    "requests==2.32.3",
    "testcontainers==4.9.0",
    # Starlette 1.x TestClient transport. Dev-only: nothing in the services
    # calls out over HTTP with it.
    "httpx2==2.9.1",
]
# The side-service entrypoints are intentionally not workspace packages. Their
# complete transitive graphs still live in uv.lock, so every image consumes the
# same reviewed lock as the production API instead of maintaining hand-written
# requirements files that drift independently.
prototype-runtime = [
    "psycopg[binary]==3.2.3",
]
ingestion-runtime = [
    "fastapi==0.141.1",
    "prometheus-client==0.21.1",
    "requests==2.32.3",
    "uvicorn[standard]==0.34.0",
]
financing-runtime = [
    "fastapi==0.141.1",
    "prometheus-client==0.21.1",
    "requests==2.32.3",
    "uvicorn[standard]==0.34.0",
]
embedding-runtime = [
    "fastapi==0.141.1",
    "prometheus-client==0.21.1",
    "sentence-transformers==5.6.1",
    "torch==2.13.0",
    # Qwen3 is native in this version, so the model repository never executes
    # Python through trust_remote_code.
    "transformers==5.14.1",
    "uvicorn[standard]==0.34.0",
]

[tool.uv]
# The root is a virtual project: it pins the toolchain and holds shared quality
# configuration, but is never built or published.
package = false
# Pin uv itself so a lockfile refresh cannot silently change resolver behavior.
required-version = ">=0.9,<1.0"

[tool.uv.workspace]
# Listed one at a time rather than `services/*`: the remaining service
# directories are side-service scripts with no manifest, and a glob would fail
# the lock on them.
members = ["packages/*", "services/api"]

[tool.uv.sources]
tenantchat-core = { workspace = true }
tenantchat-api = { workspace = true }
tenantchat-orchestration = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
# The embedding deployment is CPU-only. The explicit upstream index avoids
# locking and shipping CUDA libraries that the image can never use.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages", "services", "tests", "evals"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: requires Postgres, Elasticsearch, or the embedding service",
    "security: tenant-isolation and abuse regression tests",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tenantchat"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
# The hermetic suite (make test-cov, CI's quality job) reports ~82% with no
# service containers; the Postgres integration suites run separately and do
# not contribute here. 80 is that level minus a margin for legitimate line
# movement, still tight enough that an untested surface stops the build.
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "architecture/likec4/node_modules",
    "architecture/likec4/dist",
    # Side-service entrypoints that predate the shared packages; each will be
    # rewritten to import from the packages once the RAG work lands.
    "services/embedding/app.py",
    "services/ingestion/app.py",
    "services/financing-agent/app.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "DTZ",  # timezone-aware datetimes
    "T20",  # no print in library code
    "SIM",  # simplify
    "PTH",  # prefer pathlib
    "TID",  # tidy imports
    "RUF",  # ruff-specific
    "S",    # bandit security
    "ANN",  # require annotations
]
ignore = [
    "ANN401", # allow explicit Any where a Protocol genuinely needs it
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["tenantchat"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
# Named per converted service rather than as `services`: the sibling directories
# still hold excluded side-service scripts, and mypy errors on a directory with
# nothing to check.
files = ["packages", "services/api", "scripts", "tests", "evals", "runtime_security.py"]
exclude = ["architecture/"]
# `tenantchat` is a PEP 420 namespace package under a src layout, so mypy cannot
# infer where the package root starts. Without these it derives two module names
# for the same file ("core.catalog" and "tenantchat.core.catalog") and bails.
# Each workspace member's src directory is added here as it is created.
mypy_path = ["packages/core/src", "packages/orchestration/src", "services/api/src"]
explicit_package_bases = true
namespace_packages = true
