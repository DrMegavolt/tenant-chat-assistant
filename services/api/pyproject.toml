[project]
name = "tenantchat-api"
version = "0.1.0"
description = "HTTP edge: routers, request/response schemas, and adapters"
requires-python = ">=3.12,<3.13"

# The adapter layer, so frameworks are expected here and banned in
# `packages/core`. What must not appear is a business rule: this package
# translates HTTP to domain calls and domain results back to HTTP.
dependencies = [
    "tenantchat-core",
    # The composition root wires the agent runtime, so the framework arrives
    # here transitively and by design. `tenantchat.api.agent` is the only module
    # in this package allowed to reference it.
    "tenantchat-orchestration",
    "alembic==1.14.0",
    "fastapi==0.141.1",
    # SQLAlchemy's async facade uses greenlet even with a native async driver.
    # Declare it explicitly because SQLAlchemy's optional marker misses macOS arm64.
    "greenlet==3.5.4",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.5",
    # FastAPI multipart forms need the parser at runtime; declared explicitly
    # rather than relying on the framework's optional extra.
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenantchat"]
