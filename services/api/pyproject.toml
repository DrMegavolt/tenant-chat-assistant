[project]
name = "tenantchat-api"
version = "0.1.0"
description = "HTTP edge: routers, request/response schemas, and adapters"
requires-python = ">=3.12,<3.13"

# The adapter layer, so frameworks are expected here and banned in
# `packages/core`. What must not appear is a business rule: this package
# translates HTTP to domain calls and domain results back to HTTP.
dependencies = [
    "tenantchat-core",
    "alembic==1.14.0",
    "fastapi==0.115.6",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.5",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenantchat"]
